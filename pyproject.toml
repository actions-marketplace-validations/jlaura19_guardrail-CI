[project]
name = "guardrail-ci"
version = "0.1.0"
description = "Developer-first SAST for FastAPI: insecure routes, vulnerable dependencies and hardcoded secrets."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["typer>=0.12", "httpx>=0.27", "rich>=13", "packaging>=23"]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
guardrail = "guardrail.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["guardrail*"]
